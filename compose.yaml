services:
  pact:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PACT_DEMO_PIN: ${PACT_DEMO_PIN:-246810}
      PACT_DATABASE_URL: sqlite:///data/pact.db
      PACT_OLLAMA_URL: ${PACT_OLLAMA_URL:-}
      PACT_OLLAMA_MODEL: ${PACT_OLLAMA_MODEL:-}
    volumes:
      - pact-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
volumes:
  pact-data:
