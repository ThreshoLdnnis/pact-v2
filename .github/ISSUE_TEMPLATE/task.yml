name: 开发任务
description: 为 A/B/C/D 创建有验收标准的工作项
title: "[角色] 任务标题"
body:
  - type: dropdown
    id: role
    attributes:
      label: 负责人角色
      options:
        - A - Agent
        - B - Banking Sandbox
        - C - Policy & Security
        - D - Workbench & Integration
        - Shared - 共同评审
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 目标与范围
      description: 写清要交付的行为、主要目录与本任务不覆盖的部分。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准与证据
      description: 使用清单写出可验证的结果。
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖 / 公共接口 / 需要谁评审
      description: 接口或端口变更请另开接口变更单并关联。
    validations:
      required: true
